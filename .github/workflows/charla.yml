name: charla

# La charla vive en charla/. Este flujo no toca el despliegue de Evidentia.
on:
  push:
    branches: [main]
    paths: ['charla/**', '.github/workflows/charla.yml']
  pull_request:
    paths: ['charla/**', '.github/workflows/charla.yml']
  workflow_dispatch:

concurrency:
  group: charla-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: charla

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: charla/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Las pruebas de extremo a extremo levantan wrangler dev con simuladores de
      # NCBI, Anthropic y Evidentia, y abren /vivo y /presentador en Chromium.
      - run: npx playwright@1.56.1 install --with-deps chromium
      - run: npm run e2e
        env:
          CI: 'true'

  desplegar:
    # Solo desde main y solo si todo lo anterior pasó. El ensayo y el día de la
    # charla se despliega con `npm run deploy` desde el portátil, con la misma cuenta.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verificar
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: charla/package-lock.json
      - run: npm ci
      # Con CHARLA_DESPLIEGUE=1 la construcción se niega a desplegar sin respaldos grabados.
      - run: npm run construir
        env:
          CHARLA_DESPLIEGUE: '1'
      - name: Desplegar el Worker
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: charla
          command: deploy
      - name: Comprobar que quedó vivo
        run: |
          BASE="${{ steps.deploy.outputs.deployment-url }}"
          if [ -z "$BASE" ]; then BASE="${{ vars.CHARLA_URL }}"; fi
          if [ -z "$BASE" ]; then echo "::error::Sin URL del despliegue ni vars.CHARLA_URL"; exit 1; fi
          sleep 8
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$BASE/api/salud" || echo 000)
            if [ "$code" = "200" ]; then echo "✓ $BASE/api/salud"; exit 0; fi
            echo "intento $i: HTTP $code"; sleep 6
          done
          echo "::error::El Worker no responde en /api/salud"; exit 1
